name: Build Gen Tools OFX

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSVC x64
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build Gen Tools OFX Bundle
      shell: cmd
      run: |
        build.bat

    - name: Package Release ZIP
      shell: cmd
      run: |
        mkdir dist 2>nul
        powershell -Command "Compress-Archive -Path build\AlphaGenSAM.ofx.bundle, install.bat, uninstall.bat, icons, README.md, LICENSE -DestinationPath dist\GenTools_OFX_win64.zip -Force"

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GenTools_OFX_win64
        path: dist/GenTools_OFX_win64.zip

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/GenTools_OFX_win64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
